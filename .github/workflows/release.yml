name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing GitHub Release tag to promote to PyPI
        required: true
        type: string

permissions:
  contents: write
  id-token: write

jobs:
  test:
    if: github.event_name == 'push'
    uses: ./.github/workflows/ci.yml

  github-release:
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Verify tag matches package version
        run: |
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "v${VERSION}" = "${GITHUB_REF_NAME}"
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist
      - name: Generate checksums
        run: sha256sum dist/* > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, 'rc') }}
          generate_release_notes: true
          files: |
            dist/*
            SHA256SUMS

  publish-python:
    if: github.event_name == 'push'
    needs: [test, github-release]
    runs-on: ubuntu-latest
    environment:
      name: ${{ contains(github.ref_name, 'rc') && 'testpypi' || 'pypi' }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist
      - name: Publish release candidate to TestPyPI
        if: contains(github.ref_name, 'rc')
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
      - name: Publish stable release to PyPI
        if: ${{ !contains(github.ref_name, 'rc') }}
        uses: pypa/gh-action-pypi-publish@release/v1

  promote-to-pypi:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download existing GitHub Release distributions
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          case "${RELEASE_TAG}" in
            v*) ;;
            *) echo "tag must start with v"; exit 1 ;;
          esac
          mkdir dist
          gh release download "${RELEASE_TAG}" \
            --pattern "a_ledger-*.whl" \
            --pattern "a_ledger-*.tar.gz" \
            --dir dist
          VERSION="${RELEASE_TAG#v}"
          test -f "dist/a_ledger-${VERSION}-py3-none-any.whl"
          test -f "dist/a_ledger-${VERSION}.tar.gz"
          test "$(find dist -maxdepth 1 -type f | wc -l)" -eq 2
      - name: Publish existing distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
